version: '3.8'

services:
  # ── Data Stores ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: windmotion-postgres
    environment:
      POSTGRES_DB: windmotion
      POSTGRES_USER: windmotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windmotion_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windmotion"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: windmotion-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-windmotion_dev}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: windmotion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: windmotion-backend
    environment:
      DATABASE_URL: postgresql://windmotion:${POSTGRES_PASSWORD:-windmotion_dev}@postgres:5432/windmotion
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-windmotion_dev}
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      BSCSCAN_API_KEY: ${BSCSCAN_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "python -m backend.db.migrations.run_migrations &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8080 --reload"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: windmotion-worker
    environment:
      DATABASE_URL: postgresql://windmotion:${POSTGRES_PASSWORD:-windmotion_dev}@postgres:5432/windmotion
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-windmotion_dev}
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      BSCSCAN_API_KEY: ${BSCSCAN_API_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      TASK_TIMEOUT: ${TASK_TIMEOUT:-600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
    command: python -m worker.main

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windmotion-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
