version: '3.8'

services:
  # PostgreSQL - Structured data storage
  postgres:
    image: postgres:16-alpine
    container_name: windmotion-postgres
    environment:
      POSTGRES_DB: windmotion
      POSTGRES_USER: windmotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windmotion_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windmotion"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j - Graph database for causal graphs
  neo4j:
    image: neo4j:5-community
    container_name: windmotion-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-windmotion_dev}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data

  # Redis - Cache and task queue
  redis:
    image: redis:7-alpine
    container_name: windmotion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windmotion-backend
    environment:
      DATABASE_URL: postgresql://windmotion:${POSTGRES_PASSWORD:-windmotion_dev}@postgres:5432/windmotion
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-windmotion_dev}
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      BSCSCAN_API_KEY: ${BSCSCAN_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windmotion-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
