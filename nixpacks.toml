# nixpacks.toml — 供 Backend 和 Worker 两个服务共用
# 两个服务的 Root Directory 都设为 "/"，所以共享此文件
# 各自的 startCommand 在各自的 railway.json 中定义

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  # 先装 backend 依赖（backend 和 worker 都需要）
  "pip install -r backend/requirements.txt",
  # 再装 worker 额外依赖（backend 服务安装多点无害）
  "pip install -r worker/requirements.txt",
]

[start]
# 此处留空 —— 由各服务的 railway.json startCommand 覆盖
cmd = ""
